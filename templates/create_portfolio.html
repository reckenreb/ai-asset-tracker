{% extends "base.html" %}

{% block title %}Neues Portfolio - Asset Tracker{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0"><i class="bi bi-collection me-2"></i>Neues Portfolio</h1>
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Zurück
    </a>
</div>

<div class="card">
    <div class="card-header bg-warning">
        <i class="bi bi-plus-circle me-2"></i>Portfolio anlegen
    </div>
    <div class="card-body">
        {% if assets %}
        <form method="POST" action="{{ url_for('create_portfolio') }}" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="Portfolio-Name" required autofocus>
            </div>
            <div class="col-md-6">
                <label class="form-label">Assets</label>
                <select class="form-select" name="assets" multiple required>
                    {% for asset in assets %}
                    <option value="{{ asset }}">{{ display_name(asset) }}</option>
                    {% endfor %}
                </select>
                <div class="form-text">Strg/Cmd + Klick für mehrere Assets</div>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-warning w-100">
                    <i class="bi bi-plus-lg me-2"></i>Erstellen
                </button>
            </div>
        </form>
        {% else %}
        <p class="text-muted mb-0">Lege zuerst mindestens ein Asset an.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
