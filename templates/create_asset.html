{% extends "base.html" %}

{% block title %}Neues Asset - Asset Tracker{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0"><i class="bi bi-wallet2 me-2"></i>Neues Asset</h1>
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Zurück
    </a>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <i class="bi bi-plus-circle me-2"></i>Asset anlegen
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('create_asset') }}" class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" placeholder="z. B. Girokonto oder Depot" required autofocus>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-plus-lg me-2"></i>Erstellen
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
