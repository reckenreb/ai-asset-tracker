{% extends "base.html" %}

{% block title %}Login - Asset Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Anmeldung</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">Bitte gib das Passwort ein, um Zugriff auf den Asset Tracker zu erhalten.</p>

                <form method="POST">
                    {% if request.args.get('next') %}
                    <input type="hidden" name="next" value="{{ request.args.get('next') }}">
                    {% endif %}
                    <div class="mb-3">
                        <label for="password" class="form-label">Passwort</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Passwort eingeben" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Einloggen
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
